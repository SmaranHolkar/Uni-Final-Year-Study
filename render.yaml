services:
  # Frontend Static Site Service
  - type: web
    name: uni-final-year-study-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && VITE_API_URL=$BACKEND_URL npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: BACKEND_URL
        value: https://uni-final-year-study-backend.onrender.com
    routes:
      - path: /*
        destination: /index.html

  # Backend API Service
  - type: web
    name: uni-final-year-study-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
    healthCheckPath: /api/health
